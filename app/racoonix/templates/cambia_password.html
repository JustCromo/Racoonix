{% extends "base.html" %}
{% block titolo %}Cambia password - Racoonix{% endblock %}
{% block contenuto %}
<section class="scheda stretta">
  <h1>Cambia password</h1>
  {% if g.utente.deve_cambiare_password %}<p class="sotto">Al primo accesso devi scegliere una nuova password.</p>{% endif %}
  {% if errore %}<p class="errore">{{ errore }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.cambia_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Password attuale <input name="attuale" type="password" autocomplete="current-password" required></label>
    <label>Nuova password <input name="nuova" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>Ripeti nuova password <input name="conferma" type="password" autocomplete="new-password" minlength="12" required></label>
    <button type="submit">Salva</button>
  </form>
</section>
{% endblock %}
