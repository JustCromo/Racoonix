<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false, "allowScriptTags": false}'>
  <title>{% block titolo %}Racoonix{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='vendor/htmx.min.js') }}" defer></script>
</head>
<body>
  <main class="{% block classe_main %}{% endblock %}">
    {% with messaggi = get_flashed_messages(with_categories=true) %}
    {% for categoria, messaggio in messaggi %}<p class="flash {{ categoria }}">{{ messaggio }}</p>{% endfor %}
    {% endwith %}
    {% block contenuto %}{% endblock %}
  </main>
  {% block script %}{% endblock %}
</body>
</html>
