{% extends "base.html" %}
{% block titolo %}Accedi - Racoonix{% endblock %}
{% block contenuto %}
<section class="scheda stretta">
  <h1>Racoonix</h1>
  <p class="sotto">{{ market }}</p>
  {% if errore %}<p class="errore">{{ errore }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" autocomplete="username" maxlength="40" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Accedi</button>
  </form>
  <p class="sotto spazio"><a href="{{ url_for('auth.password_dimenticata') }}">Password dimenticata?</a></p>
</section>
{% endblock %}
