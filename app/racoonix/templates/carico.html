{% extends "base.html" %}
{% block titolo %}Carico merce - Racoonix{% endblock %}
{% block contenuto %}
<p><a href="{{ url_for('home') }}">&larr; Home</a></p>
<h1>Carico merce</h1>
<section class="scheda">
  <form id="modulo-codice" method="post" action="{{ url_for('carico.leggi') }}" class="riga">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input id="codice" name="codice" autocomplete="off" autofocus maxlength="250" placeholder="Leggi o scrivi il codice">
    <button type="submit">Avanti</button>
  </form>
  <button id="avvia" type="button" class="secondario">Usa fotocamera</button>
  <div id="lettore"></div>
</section>
{% if sfusi %}
<section class="scheda spazio">
  <h2>Prodotti senza codice</h2>
  <form method="post" action="{{ url_for('carico.sfuso') }}" class="riga">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <select name="prodotto_id">{% for p in sfusi %}<option value="{{ p.id }}">{{ p.nome }}</option>{% endfor %}</select>
    <button type="submit">Avanti</button>
  </form>
</section>
{% endif %}
{% endblock %}
{% block script %}
<script src="{{ url_for('static', filename='vendor/html5-qrcode.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/carico.js') }}"></script>
{% endblock %}
