{% extends "base.html" %}
{% from "_icone.html" import icona %}
{% block titolo %}Utenti - Racoonix{% endblock %}
{% block contenuto %}
<div class="intestazione">
  <h1>Utenti</h1>
  <a class="pulsante" href="{{ url_for('utenti.nuovo') }}">{{ icona("user-plus") }} Nuovo utente</a>
</div>
{% if errore %}<p class="errore">{{ errore }}</p>{% endif %}
<form method="get" action="{{ url_for('utenti.elenco') }}" class="riga"
      hx-get="{{ url_for('utenti.risultati') }}" hx-trigger="submit" hx-target="#risultati">
  <input name="q" value="{{ q }}" maxlength="40" placeholder="Cerca per username" autocomplete="off"
         hx-get="{{ url_for('utenti.risultati') }}" hx-trigger="input changed delay:300ms"
         hx-target="#risultati" hx-include="closest form">
  <select name="ruolo" hx-get="{{ url_for('utenti.risultati') }}" hx-trigger="change" hx-target="#risultati" hx-include="closest form">
    <option value="">Tutti i ruoli</option>
    {% for r in ["admin", "magazziniere", "dipendente"] %}<option value="{{ r }}" {% if r == ruolo %}selected{% endif %}>{{ r }}</option>{% endfor %}
  </select>
  <select name="stato" hx-get="{{ url_for('utenti.risultati') }}" hx-trigger="change" hx-target="#risultati" hx-include="closest form">
    <option value="">Tutti gli stati</option>
    {% for s, etichetta in [("attivo", "Attivi"), ("disattivato", "Disattivati"), ("bloccato", "Bloccati"), ("temporanea", "Con password temporanea")] %}
    <option value="{{ s }}" {% if s == stato %}selected{% endif %}>{{ etichetta }}</option>
    {% endfor %}
  </select>
</form>
<div id="risultati">{% include "_utenti_risultati.html" %}</div>
{% endblock %}
