{% extends "base.html" %}
{% block classe_main %}largo{% endblock %}
{% block titolo %}Catalogo - Racoonix{% endblock %}
{% block contenuto %}
<p><a href="{{ url_for('home') }}">&larr; Home</a></p>
<h1>Catalogo prodotti</h1>
<form method="get" action="{{ url_for('anagrafica.catalogo') }}" class="riga"
      hx-get="{{ url_for('anagrafica.catalogo_risultati') }}" hx-trigger="submit" hx-target="#risultati">
  <input name="q" value="{{ q }}" maxlength="100" placeholder="Nome, marca o codice" autocomplete="off"
         hx-get="{{ url_for('anagrafica.catalogo_risultati') }}" hx-trigger="input changed delay:300ms"
         hx-target="#risultati" hx-include="closest form">
  <select name="stato" hx-get="{{ url_for('anagrafica.catalogo_risultati') }}" hx-trigger="change"
          hx-target="#risultati" hx-include="closest form">
    <option value="">Tutti gli stati</option>
    {% for s, etichetta in [("attivo", "Attivi"), ("in_attesa", "In attesa"), ("rimosso", "Rimossi")] %}
    <option value="{{ s }}" {% if s == stato %}selected{% endif %}>{{ etichetta }}</option>
    {% endfor %}
  </select>
</form>
<div id="risultati">{% include "_catalogo_risultati.html" %}</div>
{% endblock %}
