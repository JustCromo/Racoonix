{% extends "base.html" %}
{% block titolo %}Banco - Racoonix{% endblock %}
{% block contenuto %}
<h1>Banco: preincartati</h1>
<p class="sotto">Stampa l'etichetta con la bilancia, poi leggila qui.</p>
<section class="scheda">
  <form id="modulo-codice" method="post" action="{{ url_for('banco.leggi') }}" class="riga">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input id="codice" name="codice" autocomplete="off" autofocus maxlength="250" placeholder="Leggi l'etichetta della bilancia">
    <button type="submit">Avanti</button>
  </form>
  <button id="avvia" type="button" class="secondario">Usa fotocamera</button>
  <div id="lettore"></div>
</section>
{% endblock %}
{% block script %}
<script src="{{ url_for('static', filename='vendor/html5-qrcode.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/carico.js') }}"></script>
{% endblock %}
