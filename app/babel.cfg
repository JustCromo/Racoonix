# Testi da tradurre. Per aggiornare le traduzioni, dalla cartella app/:
#   pybabel extract -F babel.cfg -k _ -k _l -k testo_negozio -k N_ -k lazy_gettext -k gettext --no-location --sort-output -o messages.pot .
#   pybabel update -i messages.pot -d racoonix/translations   (poi traduci i testi nuovi nel file .po)
#   pybabel compile -d racoonix/translations
[python: racoonix/**.py]
[jinja2: racoonix/templates/**.html]
