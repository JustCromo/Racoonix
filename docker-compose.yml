name: racoonix

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: racoonix
      POSTGRES_USER: racoonix
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racoonix -d racoonix"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    image: racoonix-app:latest
    restart: unless-stopped
    environment:
      MARKET_NAME: ${MARKET_NAME:-Racoonix Demo}
      RACOONIX_TEST_SCANNER: ${RACOONIX_TEST_SCANNER:-0}
      ADMIN_IP_CONSENTITI: ${ADMIN_IP_CONSENTITI:-127.0.0.1/32}
    secrets: [db_password, flask_secret, admin_credentials]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      RACOONIX_HOST: ${RACOONIX_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend:

volumes:
  db_data:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password
  flask_secret:
    file: ./secrets/flask_secret
  admin_credentials:
    file: ./secrets/admin_credentials
