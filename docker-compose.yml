name: racoonix

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: racoonix
      POSTGRES_USER: racoonix
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racoonix -d racoonix"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    image: racoonix-app:latest
    restart: unless-stopped
    environment:
      MARKET_NAME: ${MARKET_NAME:-Racoonix Demo}
      RACOONIX_TEST_SCANNER: ${RACOONIX_TEST_SCANNER:-0}
      ADMIN_IP_CONSENTITI: ${ADMIN_IP_CONSENTITI:-127.0.0.1/32}
      TZ: Europe/Rome
    secrets: [db_password, flask_secret, admin_credentials]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend, integrazione]

  scheduler:
    image: racoonix-app:latest
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "racoonix.scheduler"]
    environment:
      MARKET_NAME: ${MARKET_NAME:-Racoonix Demo}
      TZ: Europe/Rome
    secrets: [db_password, flask_secret]
    depends_on:
      app:
        condition: service_started
    networks: [backend]

  simulatore:
    profiles: ["integrazione"]
    build: ./simulatore
    image: racoonix-simulatore:latest
    restart: unless-stopped
    environment:
      RACOONIX_API: http://app:8000/api/v1
      TZ: Europe/Rome
    secrets: [sim_secret, cassa_token, bilancia_token]
    depends_on: [app]
    networks: [demo, integrazione]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "8443:8443"]
    environment:
      RACOONIX_HOST: ${RACOONIX_HOST:-localhost}
      RACOONIX_SNI: ${RACOONIX_SNI:-localhost}
      RACOONIX_SIM_HOST: ${RACOONIX_SIM_HOST:-localhost:8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [frontend, demo]

networks:
  backend:
    internal: true
  frontend:
  demo:
  integrazione:
    internal: true

volumes:
  db_data:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password
  flask_secret:
    file: ./secrets/flask_secret
  admin_credentials:
    file: ./secrets/admin_credentials
  sim_secret:
    file: ./secrets/sim_secret
  cassa_token:
    file: ./secrets/cassa_token
  bilancia_token:
    file: ./secrets/bilancia_token
