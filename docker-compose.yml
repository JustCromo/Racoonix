name: racoonix

# Indurimento comune: nessun privilegio aggiuntivo e nessun "superpotere" Linux.
x-indurito: &indurito
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: racoonix
      POSTGRES_USER: racoonix
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racoonix -d racoonix"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrazioni:
    image: racoonix-app:latest
    pull_policy: never
    restart: "no"
    <<: *indurito
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "-m", "racoonix.bootstrap"]
    environment:
      MARKET_NAME: ${MARKET_NAME:-Racoonix Demo}
      RACOONIX_DB_RUOLO: proprietario
      TZ: Europe/Rome
    secrets: [db_password, db_app_password, flask_secret, admin_credentials]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  app:
    build: ./app
    image: racoonix-app:latest
    restart: unless-stopped
    <<: *indurito
    read_only: true
    tmpfs: [/tmp]
    environment:
      MARKET_NAME: ${MARKET_NAME:-Racoonix Demo}
      ADMIN_IP_CONSENTITI: ${ADMIN_IP_CONSENTITI:-127.0.0.1/32}
      RACOONIX_INDIRIZZO: ${RACOONIX_SNI:-localhost}
      RACOONIX_NOME: ${RACOONIX_NOME:-racoonix.local}
      TZ: Europe/Rome
    secrets: [db_app_password, flask_secret]
    depends_on:
      migrazioni:
        condition: service_completed_successfully
    networks: [backend, frontend]

  scheduler:
    image: racoonix-app:latest
    pull_policy: never
    restart: unless-stopped
    <<: *indurito
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "-m", "racoonix.scheduler"]
    environment:
      MARKET_NAME: ${MARKET_NAME:-Racoonix Demo}
      TZ: Europe/Rome
    secrets: [db_app_password, flask_secret]
    depends_on:
      app:
        condition: service_started
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    environment:
      RACOONIX_HOST: ${RACOONIX_HOST:-localhost}
      RACOONIX_SNI: ${RACOONIX_SNI:-localhost}
      RACOONIX_NOME: ${RACOONIX_NOME:-racoonix.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend:

volumes:
  db_data:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password
  flask_secret:
    file: ./secrets/flask_secret
  db_app_password:
    file: ./secrets/db_app_password
  admin_credentials:
    file: ./secrets/admin_credentials
