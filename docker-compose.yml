name: racoonix

# Indurimento comune: nessun privilegio aggiuntivo e nessun "superpotere" Linux.
x-indurito: &indurito
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# I segreti nascono al primo avvio dentro volumi Docker: ogni servizio monta solo quelli che gli servono.
x-segreti-app: &segreti-app segreti_app:/run/secrets/app:ro

services:
  segreti:
    image: racoonix-app:latest
    pull_policy: never
    restart: "no"
    <<: *indurito
    user: "0:0"
    read_only: true
    command: ["python", "-m", "racoonix.segreti"]
    volumes:
      - segreti_db:/segreti/db
      - segreti_app:/segreti/app
    network_mode: none

  db:
    build: ./db
    image: racoonix-db:latest
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: racoonix
      POSTGRES_USER: racoonix
      POSTGRES_PASSWORD_FILE: /run/secrets/db/db_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - segreti_db:/run/secrets/db:ro
    depends_on:
      segreti:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racoonix -d racoonix"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrazioni:
    image: racoonix-app:latest
    pull_policy: never
    restart: "no"
    <<: *indurito
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "-m", "racoonix.bootstrap"]
    environment:
      RACOONIX_DB_RUOLO: proprietario
      # Solo per le installazioni precedenti: al primo avvio le loro impostazioni passano nel database
      MARKET_NAME: ${MARKET_NAME:-}
      RACOONIX_LINGUA: ${RACOONIX_LINGUA:-}
      RACOONIX_PAESE: ${RACOONIX_PAESE:-}
      RACOONIX_FUSO: ${RACOONIX_FUSO:-}
      ADMIN_IP_CONSENTITI: ${ADMIN_IP_CONSENTITI:-}
    volumes:
      - segreti_db:/run/secrets/db:ro
      - *segreti-app
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  app:
    build: ./app
    image: racoonix-app:latest
    restart: unless-stopped
    <<: *indurito
    read_only: true
    tmpfs: [/tmp]
    environment:
      RACOONIX_IP: ${RACOONIX_IP:-localhost}
      RACOONIX_INDIRIZZO: ${RACOONIX_IP:-localhost}
      RACOONIX_NOME: ${RACOONIX_NOME:-racoonix.local}
      RACOONIX_VERSIONE: ${RACOONIX_VERSIONE:-}
    volumes:
      - *segreti-app
    depends_on:
      migrazioni:
        condition: service_completed_successfully
    networks: [backend, frontend]

  scheduler:
    image: racoonix-app:latest
    pull_policy: never
    restart: unless-stopped
    <<: *indurito
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "-m", "racoonix.scheduler"]
    volumes:
      - *segreti-app
    depends_on:
      app:
        condition: service_started
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    environment:
      RACOONIX_HOST: "localhost, ${RACOONIX_IP:-localhost}, ${RACOONIX_NOME:-racoonix.local}"
      RACOONIX_SNI: ${RACOONIX_IP:-localhost}
      RACOONIX_NOME: ${RACOONIX_NOME:-racoonix.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [frontend]

  # Annuncia racoonix.local nella rete: deve vedere la rete del server, ma non ha altri permessi.
  mdns:
    build: ./mdns
    image: racoonix-mdns:latest
    restart: unless-stopped
    <<: *indurito
    read_only: true
    network_mode: host
    environment:
      RACOONIX_IP: ${RACOONIX_IP:-}
      RACOONIX_NOME: ${RACOONIX_NOME:-racoonix.local}

networks:
  backend:
    internal: true
  frontend:

volumes:
  db_data:
  caddy_data:
  caddy_config:
  segreti_db:
  segreti_app:
